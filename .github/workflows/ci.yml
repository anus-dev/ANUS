name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - run: npm run lint:ci

      - run: npm run check:public

      - run: npm run typecheck

      - run: npm run test:ci

      - run: npm run test:agent
